<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#0d1117" />
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="url(#gradient)" stroke-width="3" opacity="0.8" />
  <!-- Monogram S / R stylized -->
  <text x="50" y="65" font-family="'Poppins', system-ui, sans-serif" font-size="46" font-weight="800" text-anchor="middle" fill="url(#gradient)" filter="url(#glow)">SR</text>
</svg>
